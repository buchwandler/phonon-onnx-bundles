name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python scripts/check_catalog_integrity.py
      - run: python scripts/build_catalog.py && git diff --exit-code -- catalog/models.json
