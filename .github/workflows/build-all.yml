name: release-all-phonon-bundles

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Immutable release-set version (for example, 0.2.0)
        required: true
        type: string
      allow_noncommercial:
        description: Acknowledge CC-BY-NC-4.0 conditions; this does not grant commercial rights
        required: true
        default: false
        type: boolean
      publish:
        description: Publish immutable GitHub Releases and activate the complete catalog
        required: true
        default: true
        type: boolean
      max_parallel:
        description: Maximum model jobs running concurrently
        required: false
        default: 3
        type: number

permissions:
  contents: read

concurrency:
  group: phonon-onnx-release-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.plan.outputs.models }}
      release_plan: ${{ steps.plan.outputs.release_plan }}
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      ALLOW_NONCOMMERCIAL: ${{ inputs.allow_noncommercial }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate release inputs before model downloads
        run: |
          python - <<'PY'
          import os
          from phonon_onnx_bundles.release_version import validate_release_version

          validate_release_version(os.environ["RELEASE_VERSION"])
          if not os.environ.get("HF_TOKEN"):
              raise SystemExit("HF_TOKEN is required for a full release.")
          if os.environ["ALLOW_NONCOMMERCIAL"].lower() != "true":
              raise SystemExit("A full release includes CC-BY-NC-4.0 models; set allow_noncommercial=true after reviewing the licenses.")
          print("Release inputs are valid; acknowledgement does not grant commercial rights.")
          PY
      - name: Install build and test dependencies
        run: python -m pip install -e '.[build,test]'
      - name: Run tests and catalog integrity before resolving or downloading models
        run: |
          pytest -q
          python scripts/check_catalog_integrity.py
      - name: Resolve immutable release plan once
        id: plan
        run: |
          python scripts/resolve_release_plan.py --release-version "$RELEASE_VERSION" --output release-plan.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from phonon_onnx_bundles.catalog import registry

          plan = json.load(open("release-plan.json", encoding="utf-8"))
          expected_models = sorted(registry()["models"])
          if sorted(plan["models"]) != expected_models:
              raise SystemExit("release plan model set differs from registry/models.json")
          plan_json = json.dumps(plan, separators=(",", ":"))
          print("models=" + json.dumps(expected_models, separators=(",", ":")))
          print("release_plan=" + plan_json)
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        model: ${{ fromJSON(needs.prepare.outputs.models) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RELEASE_PLAN: ${{ needs.prepare.outputs.release_plan }}
      MODEL_KEY: ${{ matrix.model }}
      ALLOW_NONCOMMERCIAL: ${{ inputs.allow_noncommercial }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[build,test]'
      - name: Build and verify all registry precisions for this model
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          plan = json.loads(os.environ["RELEASE_PLAN"])
          model = os.environ["MODEL_KEY"]
          if os.environ["ALLOW_NONCOMMERCIAL"].lower() != "true":
              raise SystemExit("non-commercial acknowledgement was not provided")
          for precision in plan["precisions"]:
              command = [
                  sys.executable, "scripts/build_bundle.py", model,
                  "--precision", precision,
                  "--release-version", plan["release_version"],
                  "--revision", plan["models"][model],
                  "--voices-revision", plan["voices_revision"],
                  "--exporter-revision", plan["exporter_revision"],
                  "--acknowledge-noncommercial-license",
              ]
              result = subprocess.run(command, check=True, capture_output=True, text=True)
              print(result.stdout, end="")
              lines = [line.strip() for line in result.stdout.splitlines() if line.strip()]
              if not lines:
                  raise SystemExit(f"build did not print a candidate path for {model}/{precision}")
              candidate = Path(lines[-1])
              if not (candidate / "release-manifest.json").is_file():
                  raise SystemExit(f"build returned an invalid candidate path: {candidate}")
              subprocess.run([sys.executable, "scripts/verify_candidate.py", str(candidate)], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidates-${{ matrix.model }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    concurrency:
      group: phonon-onnx-catalog-activation
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_PLAN: ${{ needs.prepare.outputs.release_plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[build,test]'
      - uses: actions/download-artifact@v4
        with:
          pattern: candidates-*
          path: dist
          merge-multiple: true
      - name: Verify exactly the frozen registry release set
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          plan = json.loads(os.environ["RELEASE_PLAN"])
          expected = {(model, precision) for model in plan["models"] for precision in plan["precisions"]}
          seen = set()
          manifests = sorted(Path("dist").glob("*/release-manifest.json"))
          for manifest_path in manifests:
              candidate = manifest_path.parent
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              key = (manifest["model_key"], manifest["precision"])
              if key not in expected or key in seen:
                  raise SystemExit(f"unexpected or duplicate candidate variant: {key}")
              if manifest["release_version"] != plan["release_version"]:
                  raise SystemExit(f"candidate {candidate} has a different release_version")
              if manifest["source"]["resolved_revision"] != plan["models"].get(key[0]):
                  raise SystemExit(f"candidate {candidate} does not use its frozen model revision")
              if manifest["exporter"]["resolved_revision"] != plan["exporter_revision"]:
                  raise SystemExit(f"candidate {candidate} does not use the frozen exporter revision")
              provenance = json.loads((candidate / "bundle/export-provenance.json").read_text(encoding="utf-8"))
              if provenance["voices"]["resolved_revision"] != plan["voices_revision"]:
                  raise SystemExit(f"candidate {candidate} does not use the frozen voice revision")
              expected_tag = f"{key[0]}-onnx-{key[1]}-v{plan['release_version']}-{plan['models'][key[0]][:8]}-files-v1"
              if manifest["tag"] != expected_tag or candidate.name != expected_tag:
                  raise SystemExit(f"candidate tag does not match the release plan: {candidate}")
              subprocess.run([sys.executable, "scripts/verify_candidate.py", str(candidate)], check=True)
              seen.add(key)
          if seen != expected:
              missing = sorted(expected - seen)
              extra = sorted(seen - expected)
              raise SystemExit(f"release artifacts are incomplete; missing={missing}; extra={extra}")
          print(f"Verified all {len(expected)} frozen model/precision variants.")
          PY
      - name: Publish immutable releases without replacing existing tags
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          for manifest_path in sorted(Path("dist").glob("*/release-manifest.json")):
              candidate = manifest_path.parent
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              tag = manifest["tag"]
              check = subprocess.run(
                  ["gh", "api", f"repos/{repository}/releases/tags/{tag}"],
                  capture_output=True, text=True,
              )
              if check.returncode == 0:
                  raise SystemExit(f"Immutable GitHub Release {tag} already exists; refusing to replace it.")
              if "HTTP 404" not in check.stderr and "Not Found" not in check.stderr:
                  raise SystemExit(f"Could not safely check whether release {tag} exists: {check.stderr}")
              assets = sorted((candidate / "release-assets").iterdir())
              command = [
                  "gh", "release", "create", tag,
                  str(candidate / f"{tag}.zip"),
                  str(candidate / "release-manifest.json"),
                  str(candidate / "SHA256SUMS"),
                  *[str(asset) for asset in assets],
                  "--target", os.environ["GITHUB_SHA"],
                  "--title", tag,
                  "--notes-file", str(candidate / "release-notes.md"),
              ]
              subprocess.run(command, check=True)
          PY
      - name: Activate only the complete requested release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python scripts/refresh_catalog.py --repository "$GITHUB_REPOSITORY" --release-version "$RELEASE_VERSION" --require-complete
          python scripts/check_catalog_integrity.py
      - name: Commit the catalog once
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/bundles.json
          if git diff --cached --quiet; then
            echo 'Catalog did not change after full release activation.' >&2
            exit 1
          fi
          git commit -m "chore: activate Phonon release ${RELEASE_VERSION}"
          git fetch origin main
          git rebase origin/main
          python scripts/check_catalog_integrity.py
          python -c 'import json,sys; d=json.load(open("catalog/bundles.json")); sys.exit(0 if d["release_version"] == sys.argv[1] else 1)' "$RELEASE_VERSION"
          git push origin HEAD:main
