name: build-all-models
on:
  workflow_dispatch:
    inputs:
      precision:
        required: true
        default: q4
        type: choice
        options: [fp32, q8, q4, fp16]
      allow_noncommercial:
        description: Acknowledge CC-BY-NC-4.0 for the 40m matrix entries
        required: true
        default: false
        type: boolean
permissions: {contents: read}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        model: [phonon-31m-en, phonon-40m-en, phonon-40m-fr, phonon-40m-de, phonon-40m-es, phonon-40m-pt, phonon-40m-multilingual]
    runs-on: ubuntu-latest
    env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[build,test]'
      - name: License gate
        if: startsWith(matrix.model, 'phonon-40m-') && !inputs.allow_noncommercial
        run: exit 2
      - name: Build
        run: >-
          python scripts/build_bundle.py '${{ matrix.model }}'
          --precision '${{ inputs.precision }}'
          ${{ inputs.allow_noncommercial && '--allow-noncommercial' || '' }}
      - name: Verify
        run: python scripts/verify_candidate.py "$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-${{ inputs.precision }}
          path: dist/
