name: build-bundle
on:
  workflow_dispatch:
    inputs:
      model_key:
        description: Phonon model key from registry/models.json
        required: true
        default: phonon-31m-en
        type: choice
        options:
          - phonon-31m-en
          - phonon-40m-en
          - phonon-40m-fr
          - phonon-40m-de
          - phonon-40m-es
          - phonon-40m-pt
          - phonon-40m-multilingual
      precision:
        required: true
        default: fp32
        type: choice
        options: [fp32, q8, q4, fp16]
      allow_noncommercial:
        description: Acknowledges the CC-BY-NC-4.0 noncommercial condition; does not grant commercial rights
        required: true
        default: false
        type: boolean
      publish:
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: phonon-onnx-${{ inputs.model_key }}-${{ inputs.precision }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: python -m pip install -e '.[build,test]'
      - name: Unit and catalog checks
        run: pytest -q && python scripts/check_catalog_integrity.py
      - name: Require noncommercial-license acknowledgement
        if: startsWith(inputs.model_key, 'phonon-40m-') && !inputs.allow_noncommercial
        run: |
          echo '40m model weights are CC-BY-NC-4.0; the acknowledgement does not grant commercial rights. Set allow_noncommercial=true only after reviewing the license.' >&2
          exit 2
      - name: Build candidate
        run: >-
          python scripts/build_bundle.py '${{ inputs.model_key }}'
          --precision '${{ inputs.precision }}'
          ${{ inputs.allow_noncommercial && '--acknowledge-noncommercial-license' || '' }}
      - name: Resolve candidate
        id: candidate
        run: |
          d="$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          tag="$(basename "$d")"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify ONNX, license, attribution, and release assets
        run: python scripts/verify_candidate.py '${{ steps.candidate.outputs.dir }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.tag }}
          path: ${{ steps.candidate.outputs.dir }}
          if-no-files-found: error
      - name: Publish immutable release
        if: inputs.publish
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
          CANDIDATE: ${{ steps.candidate.outputs.dir }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing replacement. Publish a new immutable tag instead." >&2
            exit 1
          fi
          mapfile -t payload_assets < <(find "$CANDIDATE/release-assets" -maxdepth 1 -type f -print | sort)
          if [ "${#payload_assets[@]}" -eq 0 ]; then
            echo "Candidate has no flattened payload assets." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$CANDIDATE/$TAG.zip" \
            "$CANDIDATE/release-manifest.json" \
            "$CANDIDATE/SHA256SUMS" \
            "${payload_assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$CANDIDATE/release-notes.md"
      - name: Refresh catalog after publish
        if: inputs.publish
        run: python scripts/refresh_catalog.py
      - name: Commit catalog change
        if: inputs.publish
        run: |
          if git diff --quiet -- catalog/bundles.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/bundles.json
          git commit -m "chore: catalog ${{ steps.candidate.outputs.tag }}"
          git pull --rebase origin main
          git push origin HEAD:main
